<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Loja Shalom</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0d47a1,
                #1565c0
            );

            padding: 20px;
        }

        .login-box {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.25);
        }

        .logo {

            text-align: center;

            font-size: 60px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            color: #0d47a1;

            margin-bottom: 5px;
        }

        .subtitulo {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {

            border-color: #1565c0;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1565c0;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #0d47a1;
        }

        #mensagem {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;
        }

        .cadastro {

            text-align: center;

            margin-top: 20px;
        }

        .cadastro a {

            color: #1565c0;

            font-weight: bold;

            text-decoration: none;
        }

        .voltar {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #1565c0;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        📦
    </div>


    <h1>
        Loja Shalom
    </h1>


    <div class="subtitulo">
        Entre na sua conta
    </div>


    <form id="loginForm">


        <label for="email">
            E-mail
        </label>


        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
        >


        <label for="senha">
            Senha
        </label>


        <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            🔐 Entrar
        </button>


    </form>


    <div id="mensagem"></div>


    <div class="cadastro">

        Ainda não possui conta?

        <a href="cadastro.html">
            Criar cadastro
        </a>

    </div>


    <a
        class="voltar"
        href="index.html"
    >
        ← Voltar para a loja
    </a>


</div>


<script>

document.addEventListener("DOMContentLoaded", function () {


    const formulario =
        document.getElementById("loginForm");


    const mensagem =
        document.getElementById("mensagem");


    formulario.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const senha =
                document
                    .getElementById("senha")
                    .value;


            // =====================================
            // LIMPAR MENSAGEM
            // =====================================

            mensagem.textContent = "";


            // =====================================
            // ADMINISTRADOR
            // =====================================

            if (
                email === "admin@shalom.com" &&
                senha === "123456"
            ) {

                // Tipo do usuário
                localStorage.setItem(
                    "tipoUsuario",
                    "admin"
                );


                // Nome
                localStorage.setItem(
                    "usuarioNome",
                    "Administrador"
                );


                // E-mail
                localStorage.setItem(
                    "usuarioLogado",
                    email
                );


                mensagem.style.color = "green";

                mensagem.textContent =
                    "✅ Login de administrador realizado!";


                setTimeout(function() {

                    window.location.href =
                        "admin.html";

                }, 500);


                return;
            }


            // =====================================
            // CARREGAR CLIENTES
            // =====================================

            let usuarios = [];


            try {

                const dados =
                    localStorage.getItem(
                        "usuariosShalom"
                    );


                if (dados) {

                    usuarios =
                        JSON.parse(dados);

                }


                if (!Array.isArray(usuarios)) {

                    usuarios = [];

                }

            } catch (erro) {

                console.error(
                    "Erro ao carregar usuários:",
                    erro
                );

                usuarios = [];

            }


            // =====================================
            // PROCURAR CLIENTE
            // =====================================

            const usuario =
                usuarios.find(function(u) {

                    const emailUsuario =
                        String(
                            u.email || ""
                        )
                        .trim()
                        .toLowerCase();


                    const senhaUsuario =
                        String(
                            u.senha || ""
                        );


                    return (
                        emailUsuario === email &&
                        senhaUsuario === senha
                    );

                });


            // =====================================
            // CLIENTE ENCONTRADO
            // =====================================

            if (usuario) {


                localStorage.setItem(
                    "tipoUsuario",
                    "cliente"
                );


                localStorage.setItem(
                    "usuarioNome",
                    usuario.nome || "Cliente"
                );


                localStorage.setItem(
                    "clienteNome",
                    usuario.nome || "Cliente"
                );


                localStorage.setItem(
                    "clienteEmail",
                    usuario.email || email
                );


                localStorage.setItem(
                    "usuarioLogado",
                    usuario.email || email
                );


                mensagem.style.color = "green";


                mensagem.textContent =
                    "✅ Login realizado! Entrando na loja...";


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 500);


                return;
            }


            // =====================================
            // LOGIN INCORRETO
            // =====================================

            mensagem.style.color = "red";


            mensagem.textContent =
                "❌ E-mail ou senha incorretos.";

        }
    );

});

</script>


</body>

</html>
