<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Loja Shalom</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0d47a1,
                #1565c0
            );
        }

        .cadastro-box {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;

            color: #0d47a1;

            margin-bottom: 25px;

            font-size: 30px;
        }

        label {
            display: block;

            margin: 15px 0 7px;

            font-weight: bold;

            color: #222;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #1565c0;

            box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.15);
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: 0;

            border-radius: 8px;

            background: #1565c0;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #mensagem {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        .login {
            text-align: center;

            margin-top: 20px;

            color: #333;
        }

        a {
            color: #1565c0;

            font-weight: bold;

            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="cadastro-box">

        <h1>📦 Criar conta</h1>


        <form id="cadastroForm">


            <!-- NOME -->

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
                required
            >


            <!-- E-MAIL -->

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
                required
            >


            <!-- SENHA -->

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                minlength="6"
                required
            >


            <!-- CONFIRMAR SENHA -->

            <label for="confirmarSenha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                minlength="6"
                required
            >


            <!-- BOTÃO -->

            <button type="submit">
                👤 Criar conta
            </button>

        </form>


        <!-- MENSAGEM -->

        <div id="mensagem"></div>


        <!-- LOGIN -->

        <div class="login">

            Já possui conta?

            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>


    <script>

        const cadastroForm =
            document.getElementById("cadastroForm");

        const mensagem =
            document.getElementById("mensagem");


        cadastroForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                // ================================
                // PEGAR DADOS
                // ================================

                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const senha =
                    document
                        .getElementById("senha")
                        .value;


                const confirmarSenha =
                    document
                        .getElementById("confirmarSenha")
                        .value;


                // ================================
                // VALIDAR SENHA
                // ================================

                if (senha !== confirmarSenha) {

                    mensagem.textContent =
                        "❌ As senhas não são iguais.";

                    mensagem.style.color = "red";

                    return;
                }


                // ================================
                // TAMANHO DA SENHA
                // ================================

                if (senha.length < 6) {

                    mensagem.textContent =
                        "❌ A senha precisa ter pelo menos 6 caracteres.";

                    mensagem.style.color = "red";

                    return;
                }


                // ================================
                // CARREGAR USUÁRIOS
                // ================================

                let usuarios = [];

                try {

                    usuarios = JSON.parse(
                        localStorage.getItem(
                            "usuariosShalom"
                        ) || "[]"
                    );

                } catch (erro) {

                    console.error(
                        "Erro ao carregar usuários:",
                        erro
                    );

                    usuarios = [];

                }


                // ================================
                // VERIFICAR E-MAIL
                // ================================

                const emailExiste =
                    usuarios.some(function(usuario) {

                        return (
                            String(usuario.email)
                                .toLowerCase() === email
                        );

                    });


                if (emailExiste) {

                    mensagem.textContent =
                        "❌ Este e-mail já está cadastrado.";

                    mensagem.style.color = "red";

                    return;
                }


                // ================================
                // CRIAR USUÁRIO
                // ================================

                const usuario = {

                    id: Date.now(),

                    nome: nome,

                    email: email,

                    senha: senha

                };


                usuarios.push(usuario);


                // ================================
                // SALVAR
                // ================================

                localStorage.setItem(
                    "usuariosShalom",
                    JSON.stringify(usuarios)
                );


                // ================================
                // MENSAGEM
                // ================================

                mensagem.textContent =
                    "✅ Cadastro realizado com sucesso!";

                mensagem.style.color = "green";


                // ================================
                // VOLTAR PARA LOGIN
                // ================================

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1000);

            }
        );

    </script>

</body>

</html>
