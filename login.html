<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo - Shalom Embalagens</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                📦
            </div>

            <h1>Loja Shalom</h1>

            <p class="subtitulo">
                Painel Administrativo
            </p>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <div
                    id="mensagem"
                    class="mensagem"
                ></div>

                <button type="submit">
                    🔐 Entrar
                </button>

            </form>

            <a href="index.html" class="voltar">
                ← Voltar para a loja
            </a>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
